name: Durable release checkpoint
description: Chain-hashed monotonic SHA-leased release evidence, published to GitHub before remote writes
inputs:
  stage:
    description: A consecutive release phase, never inferred or skipped
    required: true
  component:
    description: Engine or Landing
    required: true
  ledger-enabled:
    description: Require remote issue-ledger persistence (false only for isolated unit tests)
    default: "false"
    required: true
  ledger-issue:
    description: Existing repository issue number owning the release ledger
    required: false
  ledger-token:
    description: Scoped GitHub token with issues:write; available only to protected release jobs
    required: false
runs:
  using: composite
  steps:
    - name: Append SHA-bound checkpoint before the next remote side effect
      shell: bash
      env:
        TAGHVIM_STAGE: ${{ inputs.stage }}
        TAGHVIM_COMPONENT: ${{ inputs.component }}
        TAGHVIM_LEDGER_PERSIST: ${{ inputs.ledger-enabled }}
        TAGHVIM_LEDGER_ISSUE: ${{ inputs.ledger-issue }}
        TAGHVIM_LEDGER_TOKEN: ${{ inputs.ledger-token }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/record.mjs"
