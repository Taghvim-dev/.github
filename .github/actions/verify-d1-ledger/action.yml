name: Verify remote D1 applied migration ledger
description: Fail closed unless D1's applied-migrations table matches exactly the reviewed release SQL files
inputs:
  database:
    description: Production D1 database name
    required: true
runs:
  using: composite
  steps:
    - name: Query the applied-migrations table, not the pending list
      shell: bash
      env:
        D1_DATABASE: ${{ inputs.database }}
      run: |
        set -euo pipefail
        case "$D1_DATABASE" in taghvim-engine|taghvim-web) ;; *) echo "::error::Invalid D1 target"; exit 1;; esac
        npx wrangler d1 execute "$D1_DATABASE" --remote --json --command "SELECT name FROM d1_migrations ORDER BY id" > release-d1-applied-raw.json
    - name: Validate signed-off source against remote applied ledger
      shell: bash
      env:
        D1_DATABASE: ${{ inputs.database }}
        VERIFIER: ${{ github.action_path }}/verify-d1-ledger.mjs
      run: |
        set -euo pipefail
        node "$VERIFIER" "$D1_DATABASE" migrations release-d1-applied-raw.json release-d1-applied-evidence.json
        rm -f release-d1-applied-raw.json

    - name: Query D1 consistency, foreign keys and canonical schema without customer data
      shell: bash
      env:
        D1_DATABASE: ${{ inputs.database }}
        PROBE: ${{ github.action_path }}/read-d1-metadata.mjs
      run: |
        set -euo pipefail
        # T0: fixed read-only queries, structured response gates and named error
        # telemetry. Retries only recognized transport errors; never integrity
        # failures. Evidence files are written only after all 4 probes succeed.
        node "$PROBE" "$D1_DATABASE"
    - name: Fail closed on corruption, orphaned references and missing migrated schema
      shell: bash
      env:
        D1_DATABASE: ${{ inputs.database }}
        CHECKER: ${{ github.action_path }}/d1-postcheck.mjs
      run: |
        set -euo pipefail
        trap 'rm -f d1-quick-raw.json d1-foreign-raw.json d1-objects-raw.json d1-columns-raw.json' EXIT
        node "$CHECKER" "$D1_DATABASE" d1-quick-raw.json d1-foreign-raw.json d1-objects-raw.json d1-columns-raw.json release-d1-integrity-evidence.json
