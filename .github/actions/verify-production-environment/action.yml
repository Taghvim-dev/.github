name: Require independently reviewed production environment
description: Read-only fail-closed GitHub configuration attestation before remote Cloudflare writes
runs:
  using: composite
  steps:
    - name: Attest independent production reviewers and immutable source main (branch protection deferred)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PROTECTION_SCRIPT: ${{ github.action_path }}/verify-environment.mjs
      run: |
        set -euo pipefail
        node "$PROTECTION_SCRIPT"
