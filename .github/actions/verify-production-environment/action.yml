name: T0 owner authorized GitHub Free production environment
description: Real GitHub owner authenticated SHA approval, optional native required reviewers, current source, no Cloudflare writes
runs:
  using: composite
  steps:
    - name: Attest owner approved immutable SHA for GitHub Free and enforce configured native protection
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PROTECTION_SCRIPT: ${{ github.action_path }}/verify-environment.mjs
      run: |
        set -euo pipefail
        node "$PROTECTION_SCRIPT"
