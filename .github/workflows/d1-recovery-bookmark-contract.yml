name: d1-recovery-bookmark-contract
on:
  pull_request:
    paths:
      - ".github/actions/d1-recovery-bookmark/**"
      - "test/d1-recovery-bookmark.test.mjs"
      - ".github/workflows/d1-recovery-bookmark-contract.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/d1-recovery-bookmark/**"
      - "test/d1-recovery-bookmark.test.mjs"
      - ".github/workflows/d1-recovery-bookmark-contract.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: node --test test/d1-recovery-bookmark.test.mjs
      - name: Strict read-only code gate
        run: |
          ! grep -Eq "time_travel/restore|wrangler d1 time-travel restore" .github/actions/d1-recovery-bookmark/check.mjs
