name: public-developer-release-parity

# Does not run on each SDK/CLI/Cookbook push: release-only reconciliation prevents cascades of failure emails.
on:
  workflow_dispatch:
  push:
    tags:
      - "public-release-*"

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Taghvim-dev/SDK
          ref: main
          path: SDK
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Taghvim-dev/CLI
          ref: main
          path: CLI
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Taghvim-dev/cookbooks
          ref: main
          path: cookbooks
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify identical canonical contract and capture SHA evidence
        run: node scripts/check-public-parity.mjs --evidence
      - name: Validate public SDK and clients
        run: |
          cd SDK
          node scripts/check-release.mjs
          node --test javascript/test/*.test.mjs
          node --test examples/javascript/client.test.mjs
          PYTHONPATH=python python -m unittest discover -s python/tests -v
      - name: Validate CLI and zero-key offline paths
        run: |
          cd CLI
          npm test
      - name: Execute Cookbooks with pinned local SDK, no live network
        run: |
          ln -s ../SDK cookbooks/SDK
          cd cookbooks
          npm install --no-save --ignore-scripts --no-audit --no-fund ../SDK/javascript
          npm test
      - name: Upload immutable candidate release evidence
        uses: actions/upload-artifact@v4
        with:
          name: taghvim-public-release-evidence
          path: public-release-evidence.json
          retention-days: 30
