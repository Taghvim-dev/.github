name: verify-production-environment-contract
on:
  pull_request:
    paths:
      - '.github/actions/verify-production-environment/**'
      - 'test/verify-production-environment.test.mjs'
      - '.github/workflows/verify-production-environment-contract.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/verify-production-environment/**'
      - 'test/verify-production-environment.test.mjs'
      - '.github/workflows/verify-production-environment-contract.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: node --test test/verify-production-environment.test.mjs
      - name: Require strictly read-only protector
        run: |
          ! grep -Eq 'wrangler deploy|migrations apply|git push|/actions/workflows/.*/dispatches' .github/actions/verify-production-environment/action.yml
