name: d1-applied-ledger-contract
on:
  pull_request:
    paths:
      - '.github/actions/verify-d1-ledger/**'
      - 'test/verify-d1-ledger.test.mjs'
      - '.github/workflows/d1-applied-ledger-contract.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/verify-d1-ledger/**'
      - 'test/verify-d1-ledger.test.mjs'
      - '.github/workflows/d1-applied-ledger-contract.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  schema-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Negative-case D1 migration ledger tests
        run: node --test test/verify-d1-ledger.test.mjs
      - name: Assert read-only verification and no deploy
        run: |
          grep -F 'SELECT name FROM d1_migrations ORDER BY id' .github/actions/verify-d1-ledger/action.yml
          ! grep -Eq 'migrations apply|INSERT INTO|UPDATE d1_migrations|DROP TABLE|wrangler deploy' .github/actions/verify-d1-ledger/action.yml
