# Canonical T0 scheduled current-head observer: no recursive workflow_run fanout.
name: t0-ci-incident-reconciler
on:
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: t0-ci-incident-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Current source/PR incident lifecycle and immutable stale-issue retirement
        uses: Taghvim-dev/.github/.github/actions/ci-incident@b13c7fcdc14c7747b727c7ee2b66f8ef9dbf0f3b
