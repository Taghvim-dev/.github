# Canonical T0 current-main/open-PR polling adapter; no workflow_run cascade.
# One SHA-pinned action, immutable GitHub source evidence and event-driven stale-issue retirement.
name: t0-ci-incident-reconciler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: t0-ci-incident-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == '007dude' && github.ref == 'refs/heads/main' }} # owner-only manual admission, no cron or workflow_run
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - name: Reconcile current-head failures and retire superseded incident issues
        uses: Taghvim-dev/.github/.github/actions/ci-incident@b13c7fcdc14c7747b727c7ee2b66f8ef9dbf0f3b
