# Canonical source-head incident observer: no workflow_run cascades, no PR checkout or deployment.
name: t0-ci-incident-reconciler
on:
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: t0-ci-incident-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Current source/PR incident lifecycle and immutable stale-issue retirement
        uses: Taghvim-dev/.github/.github/actions/ci-incident@a2d99736b6ad37a31e4cf6c3887f3c18c044d8c7
