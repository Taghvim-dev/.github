name: durable-private-release-registry-contract
on:
  pull_request:
    paths:
      - '.github/actions/persist-release-evidence/**'
      - 'test/persist-release-evidence.test.mjs'
      - '.github/actions/d1-recovery-bookmark/**'
      - '.github/workflows/durable-private-release-registry-contract.yml'
  push:
    branches: [main]
    paths:
      - '.github/actions/persist-release-evidence/**'
      - 'test/persist-release-evidence.test.mjs'
      - '.github/actions/d1-recovery-bookmark/**'
      - '.github/workflows/durable-private-release-registry-contract.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verify idempotency, identity lease, redaction and no-GA semantics without token
        run: node --test test/persist-release-evidence.test.mjs
      - name: Block release writes from verification-only CI
        run: |
          ! grep -Eq 'wrangler deploy|migrations apply|GA_APPROVED.*true' .github/actions/persist-release-evidence/action.yml
          grep -F 'GITHUB_TOKEN:' .github/actions/persist-release-evidence/action.yml
