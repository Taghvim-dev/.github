name: coordinated-public-release
on:
  pull_request:
    paths:
      - "release/PUBLIC-RELEASE-MATRIX.json"
      - "release/T0-CONTROL-MATRIX.json"
      - "release/CI-INCIDENT-ROOT-CAUSES.json"
      - "scripts/check-public-release.mjs"
      - "scripts/release-runtime-provenance.mjs"
      - "test/release-runtime-provenance.test.mjs"
      - ".github/workflows/validate.yml"
      - "scripts/verify-engine-live-receipt.mjs"
      - "scripts/verify-landing-live-receipt.mjs"
      - "test/live-engine-receipt.test.mjs"
      - "test/live-landing-receipt.test.mjs"
      - "test/source-runtime-separation-20261023.test.mjs"
      - "scripts/release-pins.mjs"
      - "test/release-pins.test.mjs"
      - ".github/workflows/coordinated-public-release.yml"
  push:
    branches: [main]
    tags: ["public-release-*"]
    paths:
      - "release/PUBLIC-RELEASE-MATRIX.json"
      - "release/T0-CONTROL-MATRIX.json"
      - "release/CI-INCIDENT-ROOT-CAUSES.json"
      - "scripts/check-public-release.mjs"
      - "scripts/release-runtime-provenance.mjs"
      - "test/release-runtime-provenance.test.mjs"
      - ".github/workflows/validate.yml"
      - "scripts/verify-engine-live-receipt.mjs"
      - "scripts/verify-landing-live-receipt.mjs"
      - "test/live-engine-receipt.test.mjs"
      - "test/live-landing-receipt.test.mjs"
      - "test/source-runtime-separation-20261023.test.mjs"
      - "scripts/release-pins.mjs"
      - "test/release-pins.test.mjs"
      - ".github/workflows/coordinated-public-release.yml"
  workflow_dispatch:
    inputs:
      verify_live:
        type: boolean
        description: "Also enforce matching published website, API and contract. This is a GA gate, not a status report."
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  public-contract-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Resolve exact immutable sibling SHAs from this candidate release matrix
        id: release-pins
        run: |
          node --test test/release-pins.test.mjs
          node scripts/release-pins.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: Taghvim-dev/SDK
          ref: ${{ steps.release-pins.outputs.sdk }}
          path: SDK
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Taghvim-dev/CLI
          ref: ${{ steps.release-pins.outputs.cli }}
          path: CLI
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Taghvim-dev/cookbooks
          ref: ${{ steps.release-pins.outputs.cookbooks }}
          path: cookbooks
          persist-credentials: false
      - name: Verify immutable deployed Cloudflare source is independent of evolving GitHub SHA
        run: node --test test/release-runtime-provenance.test.mjs
      - name: T0 source/runtime and D1 receipt admission regression tests
        run: node --test test/source-runtime-separation-20261023.test.mjs test/live-engine-receipt.test.mjs test/live-landing-receipt.test.mjs
      - name: Validate cohesive public manifest and exact contract index
        run: node scripts/check-public-release.mjs
      - name: Require full live website ↔ API contract parity on manual request
        if: github.event_name == 'workflow_dispatch' && inputs.verify_live == true
        run: node scripts/check-public-release.mjs --live

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify all pinned public manifests and capture immutable source evidence
        run: node scripts/check-public-parity.mjs --evidence
      - name: Unified public Persian editorial and reference audit
        run: node scripts/check-federated-persian.mjs
      - name: Exercise SDK JavaScript and Python clients
        run: |
          cd SDK
          node scripts/check-release.mjs
          node --test javascript/test/*.test.mjs
          node --test examples/javascript/client.test.mjs
          PYTHONPATH=python python -m unittest discover -s python/tests -v
      - name: Exercise CLI including offline and key-scope safety tests
        run: |
          cd CLI
          npm test
      - name: Exercise Cookbooks with the exact released SDK
        run: |
          ln -s ../SDK cookbooks/SDK
          cd cookbooks
          npm install --no-save --ignore-scripts --no-audit --no-fund ../SDK/javascript
          npm test
      - name: Retain public release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: taghvim-public-release-evidence
          path: public-release-evidence.json
          retention-days: 30
