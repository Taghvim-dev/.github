name: public-docs-verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: License and documents
        run: |
          test -f LICENSE
          grep -q 'Apache License' LICENSE
          test -f NOTICE
          test -f profile/README.md
          test -f docs/COOKBOOKS.md
          test -f docs/B2B2B2C.md
      - name: Public Persian copy and release-language quality
        run: node scripts/check-public-copy.mjs
      - name: JavaScript reference clients
        run: |
          node --check examples/javascript/convert-date.mjs
          node --check examples/javascript/client.mjs
          node --test examples/javascript/client.test.mjs
      - name: Versioned public SDK and cookbook conformance
        run: |
          node --check sdk/javascript/index.js
          node --test sdk/javascript/test/*.test.mjs
          for file in cookbooks/*.mjs; do node --check "$file"; done
          PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests -v
          node scripts/check-sdk-release.mjs
      - name: Python reference clients
        run: python -m compileall -q examples/python
