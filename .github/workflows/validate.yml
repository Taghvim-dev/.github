name: public-docs-verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: License and documents
        run: |
          test -f LICENSE
          grep -q 'Apache License' LICENSE
          test -f NOTICE
          test -f profile/README.md
          test -f docs/COOKBOOKS.md
          test -f docs/B2B2B2C.md
      - name: Public Persian copy and release-language quality
        run: node scripts/check-public-copy.mjs
      - name: JavaScript reference clients
        run: |
          node --check examples/javascript/convert-date.mjs
          node --check examples/javascript/client.mjs
          node --test examples/javascript/client.test.mjs
      - name: Trusted workflow incident reconciliation contracts
        run: node --test test/ci-incident.test.mjs
      - name: Verify fail-closed npm audit retry contracts
        run: node --test test/npm-audit.test.mjs
      - name: T0 owner-release authentication and protected-dispatch invariants
        run: node --test test/owner-release-dispatch.test.mjs
      - name: Local canonical public registry
        run: node scripts/check-public-registry.mjs
      - name: Python reference clients
        run: python -m compileall -q examples/python
