# No Cloudflare credential, PR checkout, or automatic Production mutation.
name: t0-public-widget-sdk-reconciler
on:
  push:
    branches: [main]
    paths:
      - 'release/CANONICAL-SOURCE-COHORT.json'
      - 'release/PUBLIC-RELEASE-MATRIX.json'
      - 'release/T0-CONTROL-MATRIX.json'
      - 'scripts/reconcile-public-widget.mjs'
      - 'scripts/reconcile-source-cohort.mjs'
      - '.github/workflows/t0-public-widget-sdk-reconciler.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: taghvim-t0-public-widget-source
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Source and CI contract tests (offline)
        run: node --test test/reconcile-public-widget.test.mjs
      - name: T0 inspect private source read authority without exposing key
        id: private_source_auth
        env:
          APP_ID: ${{ vars.TAGHVIM_PRIVATE_SOURCE_APP_ID }}
          APP_KEY: ${{ secrets.TAGHVIM_PRIVATE_SOURCE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'T0_BLOCKED_CROSS_REPO_AUTH: short-lived private repository read broker unconfigured' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: T0 mint short-lived private Engine and Landing read-only GitHub App token
        id: private_source_token
        if: steps.private_source_auth.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.TAGHVIM_PRIVATE_SOURCE_APP_ID }}
          private-key: ${{ secrets.TAGHVIM_PRIVATE_SOURCE_APP_PRIVATE_KEY }}
          owner: Taghvim-dev
          repositories: |
            engine
            landing
          permission-contents: read
          permission-actions: read
      - name: Reconcile exact current public main SHAs only after successful release CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A Cohort proves snapshot consistency only. Fresh private HEAD
          # checks are required before creating ANY public source PR.
          # Scoped read-only Engine/Landing GitHub App token; not for deploy.
          TAGHVIM_PRIVATE_SOURCE_READ_TOKEN: ${{ steps.private_source_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-public-widget.mjs | tee "$RUNNER_TEMP/t0-public-reconciler.jsonl"
          if grep -q '"status":"BLOCKED_CROSS_REPO_AUTH"' "$RUNNER_TEMP/t0-public-reconciler.jsonl"; then
            echo 'T0_BLOCKED_CROSS_REPO_AUTH: no cross-repo attestation; see organization issue #150. No writes or GA authority.' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning title=Cross-repo auth unavailable::T0_BLOCKED_CROSS_REPO_AUTH; source mutations not authorized.'
          fi
