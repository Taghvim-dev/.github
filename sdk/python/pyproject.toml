[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taghvim-sdk"
version = "0.1.0.dev0"
description = "Early-access Taghvim.dev Python API client"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Taghvim.dev project contributors"}]
classifiers = ["Development Status :: 3 - Alpha","Programming Language :: Python :: 3","License :: OSI Approved :: Apache Software License"]
